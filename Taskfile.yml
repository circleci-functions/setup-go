version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  fmt:
    desc: Format Go code (gofmt + goimports)
    cmds:
      - go tool golangci-lint fmt

  lint:
    desc: Lint Go code (includes go vet via golangci-lint)
    cmds:
      - go tool golangci-lint run ./...

  test:
    desc: Run unit and CLI tests (hermetic, no network)
    cmds:
      - go tool gotestsum --junitfile test-results/unit.xml -- ./...

  acceptance:
    desc: Run acceptance tests against real go.dev (network required; safe to run locally)
    cmds:
      - go tool gotestsum --junitfile test-results/acceptance.xml --format standard-verbose -- -tags acceptance -timeout 20m ./acceptance/...

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  lint-mod:
    desc: Check go.mod / go.sum are tidy
    deps: [tidy]
    cmds:
      - git diff --exit-code -- go.mod go.sum

  dry-run:
    desc: Cross-compile setup-go locally, without uploading
    cmds:
      - go tool release --name setup-go --version v0.0.0-dryrun --dry-run

  build-acceptance:
    desc: Cross-compile the acceptance suite, so an executor with no Go can run it
    cmds:
      - |
        set -eu
        for platform in linux/amd64 darwin/arm64 windows/amd64; do
          os="${platform%/*}"; arch="${platform#*/}"
          out="dist/acceptance/$os/$arch/acceptance"
          if [ "$os" = windows ]; then out="$out.exe"; fi
          # CGO_ENABLED=0 so the binary is static: building linux/amd64 on a
          # linux/amd64 host is not a cross-compile, so cgo would otherwise
          # stay on and tie it to the builder's glibc.
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go test -c -tags acceptance -o "$out" ./acceptance
          echo "built $out"
        done

  build-tools:
    desc: >-
      Cross-compile test2json and gotestsum, so an executor with no Go can turn
      the packaged suite's output into the JUnit XML CircleCI collects.
    cmds:
      - |
        set -eu
        for platform in linux/amd64 darwin/arm64 windows/amd64; do
          os="${platform%/*}"; arch="${platform#*/}"
          ext=""
          if [ "$os" = windows ]; then ext=".exe"; fi
          for tool in cmd/test2json gotest.tools/gotestsum; do
            name="${tool##*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -o "dist/tools/$os/$arch/$name$ext" "$tool"
          done
          echo "built dist/tools/$os/$arch/{test2json,gotestsum}$ext"
        done

  smoke-local:
    desc: >-
      Run the cross-platform smoke check in a container, with the same command
      the release jobs use. IMAGE picks the executor to stand in for; the
      default has no Go, so it also covers bootstrapping from nothing.
    deps: [dry-run, build-acceptance, build-tools]
    vars:
      IMAGE: '{{.IMAGE | default "cimg/base:stable"}}'
      VERSION: '{{.VERSION | default "1.26.4"}}'
    cmds:
      - |
        set -eu
        docker run --rm \
          -v "$PWD/dist:/home/circleci/project/dist" \
          -w /home/circleci/project \
          -e SETUP_GO_DISPOSABLE=1 \
          -e SETUP_GO_BINARY=./dist/setup-go/linux/amd64/setup-go \
          -e SETUP_GO_ACCEPTANCE_VERSION="{{.VERSION}}" \
          {{.IMAGE}} \
          bash -c '
            mkdir -p test-results
            ./dist/tools/linux/amd64/gotestsum \
              --junitfile test-results/smoke.xml \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/linux/amd64/test2json -p acceptance \
                ./dist/acceptance/linux/amd64/acceptance \
                -test.v=test2json -test.run TestAcceptance_LinksOntoTheRealPath
            echo "wrote $(wc -l < test-results/smoke.xml) lines of JUnit"
          '

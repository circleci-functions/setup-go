version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  fmt:
    desc: Format Go code (gofmt + goimports)
    cmds:
      - go tool golangci-lint fmt

  lint:
    desc: Lint Go code (includes go vet via golangci-lint)
    cmds:
      - go tool golangci-lint run ./...

  test:
    desc: Run unit and acceptance tests
    cmds:
      - task: test:unit
      - task: test:acceptance

  test:unit:
    desc: Run unit tests (hermetic, no network)
    cmds:
      - go tool gotestsum -- $(go list ./... | grep -v /acceptance)

  test:acceptance:
    desc: Run acceptance tests. Cache-backed cases run against a real CircleCI task agent when available, falling back to a fake locally.
    cmds:
      - go tool gotestsum -- ./acceptance/...

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  lint-mod:
    desc: Check go.mod / go.sum are tidy
    deps: [tidy]
    cmds:
      - git diff --exit-code -- go.mod go.sum

  dry-run:
    desc: Cross-compile setup-go locally, without uploading
    cmds:
      - go tool release --name setup-go --version v0.0.0-dryrun --dry-run

  ci:
    desc: Run everything CI runs (lint + test + dry-run)
    cmds:
      - task: lint
      - task: test
      - task: dry-run

  publish:
    desc: Build and publish setup-go to S3 (VERSION required)
    requires:
      vars: [VERSION]
    cmds:
      - go tool release --name setup-go --version "{{.VERSION}}"

version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  go-version:
    type: string
    default: "1.26.4"
    description: >-
      Go version for the acceptance tests to install.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # The acceptance job execs binaries `build` already compiled, so it runs
  # on a bare base image rather than a language-preinstalled one.
  base:
    docker:
      - image: cimg/base:stable

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run: task lint
      - run: task test
      - save_cache:
          key: setup-go-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-go into ./dist and persists it to the workspace, so
  # acceptance exercises exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run: task dry-run
      - run:
          name: Compile acceptance tests
          command: go test -c -tags acceptance -o dist/acceptance/acceptance.test ./acceptance
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Runs on a bare base image (no Go preinstalled) so the acceptance suite
  # genuinely proves `setup-go install` bootstraps a Go toolchain from
  # nothing. Both binaries it execs (setup-go itself and the acceptance test
  # binary) are precompiled by `build`, since compiling either would require
  # a `go` this executor doesn't have.
  acceptance:
    executor: base
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run acceptance tests
          command: |
            export SETUP_GO_ACCEPTANCE_BINARY="$(pwd)/dist/setup-go/linux/amd64/setup-go"
            export SETUP_GO_ACCEPTANCE_VERSION="<< pipeline.parameters.go-version >>"
            cd acceptance
            "../dist/acceptance/acceptance.test" -test.v -test.timeout=20m

  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Extract version from tag
          command: |
            VERSION="${CIRCLE_TAG}-$(git rev-parse --short HEAD)"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - build:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - acceptance:
          requires: [build]
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - publish:
          requires: [test, acceptance]
          context: [functions-publisher, github-readonly]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/

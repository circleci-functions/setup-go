version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

executors:
  go:
    docker:
      - image: cimg/go:1.26

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run: task lint
      - run: task test:unit
      - save_cache:
          key: setup-go-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Runs against the real task agent, since this executor is a real CircleCI
  # execution environment: setup-go's cache calls reach the real
  # $TMPDIR/circleci-plugin.sock, just like they would for any caller. A
  # dedicated job namespaces every acceptance cache entry away from anything
  # else (CIRCLE_JOB is a cache-key component), and keeps a `-race` build and
  # a real toolchain download from delaying lint/unit feedback.
  acceptance:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      # Restore only: the `test` job owns this key, and a second saver would
      # race for an immutable key.
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run: task test:acceptance

  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Extract version from tag
          command: |
            VERSION="${CIRCLE_TAG}-$(git rev-parse --short HEAD)"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - acceptance:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - publish:
          requires: [test, acceptance]
          context: [functions-publisher, github-readonly]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/

version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  go-version:
    type: string
    default: "1.26.4"
    description: >-
      Go version for the acceptance tests to install.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # bare-smoke execs the binary `build` cross-compiled, on an image with no Go.
  base:
    docker:
      - image: cimg/base:stable
  # For the smoke jobs: a VM with a root-owned preinstalled toolchain, and the
  # two platforms where PATH and linking differ from Linux.
  machine:
    machine:
      image: ubuntu-2404:current
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

commands:
  smoke:
    description: >-
      Let setup-go pick where the toolchain goes on this executor's real PATH,
      then resolve `go` by name in a process that sourced nothing.

      Everything runs from the workspace, so the executor needs no Go, no
      modules and no checkout: the suite is a cross-compiled test binary, and
      test2json and gotestsum turn its output into the JUnit CircleCI collects.
      gotestsum warns that it cannot find `go` to record a version with; that
      is the point, and harmless.
    parameters:
      platform:
        type: string
        description: The os/arch whose artifacts to run, e.g. linux/amd64.
      ext:
        type: string
        default: ""
        description: Executable suffix for the platform.
    steps:
      - run:
          name: Link the toolchain onto PATH and resolve it afterwards
          command: |
            mkdir -p test-results
            ./dist/tools/<< parameters.platform >>/gotestsum<< parameters.ext >> \
              --junitfile test-results/smoke.xml \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json<< parameters.ext >> \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance<< parameters.ext >> \
                -test.v=test2json -test.run TestAcceptance_LinksOntoTheRealPath
          environment:
            SETUP_GO_BINARY: ./dist/setup-go/<< parameters.platform >>/setup-go<< parameters.ext >>
            SETUP_GO_ACCEPTANCE_VERSION: << pipeline.parameters.go-version >>
      - store_test_results:
          path: test-results

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run: task lint
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-go-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-go into ./dist and persists it to the workspace, so
  # bare-smoke exercises exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run: task dry-run
      # The suite as a binary, plus the tools to report it, so an executor with
      # no Go can run and record it.
      - run: task build-acceptance
      - run: task build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Real go.dev downloads and a real task-agent. Runs on the go executor: the
  # suite installs into temp dirs and asserts the toolchain it put on PATH is
  # the one it installed, so a preinstalled Go can't produce a false pass.
  acceptance:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run:
          name: Run acceptance tests
          command: task acceptance
          environment:
            SETUP_GO_ACCEPTANCE_VERSION: << pipeline.parameters.go-version >>
            # Use the job's own cache rather than the in-memory stand-in, so the
            # round-trips here exercise the real thing. The suite fails rather
            # than falling back if it can't reach it.
            TOOLKIT_CACHE_MODE: live
      - store_test_results:
          path: test-results

  # Each of these runs the packaged suite against the packaged artifact, so the
  # executor needs no Go, no modules and no checkout. `task smoke-local`
  # reproduces the Linux ones in a container.
  #
  # cimg/base is the only image here with no Go at all, so it also proves
  # setup-go bootstraps from nothing. It runs on every push; the rest are the
  # expensive executors and gate the release instead.
  bare-smoke:
    executor: base
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-machine:
    executor: machine
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-macos:
    executor: macos
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: darwin/arm64

  smoke-windows:
    executor: windows
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: windows/amd64
          ext: ".exe"

  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Extract version from tag
          command: |
            VERSION="${CIRCLE_TAG}-$(git rev-parse --short HEAD)"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - build:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - acceptance:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - bare-smoke:
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke-machine:
          requires: [build]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - smoke-macos:
          requires: [build]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - smoke-windows:
          requires: [build]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - publish:
          requires:
            - test
            - acceptance
            - bare-smoke
            - smoke-machine
            - smoke-macos
            - smoke-windows
          context: [functions-publisher, github-readonly]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/

version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  go-version:
    type: string
    default: "1.26.4"
    description: >-
      Go version for the acceptance tests to install.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # bare-smoke execs the binary `build` cross-compiled, on an image with no Go.
  base:
    docker:
      - image: cimg/base:stable
  # The smoke jobs below cover the executors a docker image cannot stand in
  # for: a VM with a root-owned preinstalled toolchain, and the two platforms
  # where PATH and linking work differently from Linux.
  machine:
    machine:
      image: ubuntu-2404:current
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

commands:
  assert-installed-go-resolves:
    description: >-
      Fails unless a step running after the install resolves `go` by name, to
      the version that was asked for. Nothing is sourced here on purpose: this
      passes only if the toolchain is reachable through PATH itself.
    steps:
      - run:
          name: A later step resolves the installed go
          command: |
            command -v go
            go version
            case "$(go version)" in
              *"go<< pipeline.parameters.go-version >> "*) ;;
              *) echo "expected go<< pipeline.parameters.go-version >>, got $(go version)" >&2; exit 1 ;;
            esac

  assert-nothing-exported:
    description: >-
      Fails if setup-go wrote a PATH export to $BASH_ENV. Sourcing a file is
      what tied the old implementation to bash; nothing should need it now.
    steps:
      - run:
          name: $BASH_ENV holds no PATH export
          command: |
            if [ -f "$BASH_ENV" ] && grep -q '^export PATH=' "$BASH_ENV"; then
              echo "setup-go exported PATH to \$BASH_ENV:" >&2
              cat "$BASH_ENV" >&2
              exit 1
            fi

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run: task lint
      - run: task test
      - save_cache:
          key: setup-go-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-go into ./dist and persists it to the workspace, so
  # bare-smoke exercises exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run: task dry-run
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Real go.dev downloads and a real task-agent. Runs on the go executor: the
  # suite installs into temp dirs and asserts the toolchain it put on PATH is
  # the one it installed, so a preinstalled Go can't produce a false pass.
  acceptance:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - run:
          name: Run acceptance tests
          command: task acceptance
          environment:
            SETUP_GO_ACCEPTANCE_VERSION: << pipeline.parameters.go-version >>
            # Use the job's own cache rather than the in-memory stand-in, so the
            # round-trips here exercise the real thing. The suite fails rather
            # than falling back if it can't reach it.
            TOOLKIT_CACHE_MODE: live

  # The one property that needs an image without Go: the shipped artifact
  # bootstraps a toolchain from nothing and leaves it on PATH for later steps.
  bare-smoke:
    executor: base
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Go from nothing
          command: ./dist/setup-go/linux/amd64/setup-go --version << pipeline.parameters.go-version >>
      - assert-installed-go-resolves
      - assert-nothing-exported

  # Every executor where PATH is arranged differently, each asserting the same
  # thing in a step after the install: `go` resolves by name, to the version
  # asked for, with nothing sourced from a shell.
  smoke-preinstalled:
    executor: go
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Go over the one the image ships
          command: ./dist/setup-go/linux/amd64/setup-go --version << pipeline.parameters.go-version >>
      - assert-installed-go-resolves
      - assert-nothing-exported

  smoke-machine:
    executor: machine
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Go on a VM
          command: ./dist/setup-go/linux/amd64/setup-go --version << pipeline.parameters.go-version >>
      - assert-installed-go-resolves
      - assert-nothing-exported

  smoke-macos:
    executor: macos
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Go on macOS
          command: ./dist/setup-go/darwin/arm64/setup-go --version << pipeline.parameters.go-version >>
      - assert-installed-go-resolves
      - assert-nothing-exported

  smoke-windows:
    executor: windows
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Go on Windows
          command: ./dist/setup-go/windows/amd64/setup-go.exe --version << pipeline.parameters.go-version >>
      - assert-installed-go-resolves
      - assert-nothing-exported
      # The shell $BASH_ENV never reached. Nothing is sourced here, so this
      # passes only because the toolchain is linked into a directory on PATH.
      - run:
          name: A later step in another shell resolves it too
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            go version
            if (-not (go version | Select-String -SimpleMatch "go<< pipeline.parameters.go-version >>")) {
              Write-Error "expected go<< pipeline.parameters.go-version >>"
              exit 1
            }

  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-go-go-{{ checksum "go.sum" }}-
            - setup-go-go-
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Extract version from tag
          command: |
            VERSION="${CIRCLE_TAG}-$(git rev-parse --short HEAD)"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - build:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - acceptance:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - bare-smoke:
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke-preinstalled:
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke-machine:
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke-macos:
          requires: [build]
          filters:
            tags:
              only: /.*/
      - smoke-windows:
          requires: [build]
          filters:
            tags:
              only: /.*/
      - publish:
          requires: [test, acceptance, bare-smoke]
          context: [functions-publisher, github-readonly]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
